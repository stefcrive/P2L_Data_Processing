[tool.black]
line-length = 100
target-version = ["py311"]
exclude = "venv|ven|.git|.idea|node_modules|.next"

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["venv", "ven", "node_modules", "apps/web", "packages"]

